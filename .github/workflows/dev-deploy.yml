name: Deploy to EC2

on:
  push:
    branches: [ deploy/dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup environment file
      run: |
        # Copy .env.dev to .env.production for build
        cp .env.dev .env.production
        # Inject environment variables from GitHub Secrets
        echo "NEXT_PUBLIC_PORTONE_STORE_ID=${{ secrets.PORTONE_STORE_ID }}" >> .env.production
        echo "Environment file created for build"

    - name: Run linter
      run: npm run lint

    - name: Run type check
      run: npm run type-check

    - name: Build application
      run: npm run build

    - name: Create deployment package
      run: |
        # List files to verify what exists
        ls -la

        # Create tar with files that exist
        tar --exclude=node_modules -czf deploy.tar.gz \
          .next \
          package.json \
          package-lock.json \
          next.config.ts \
          ecosystem.config.js \
          .env.dev \
          $(test -d public && echo "public" || echo "")

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_SSH_PORT || 22 }}
        script: |
          # Create app directory if it doesn't exist
          mkdir -p /home/${{ secrets.EC2_USER }}/${{ secrets.EC2_FRONT_PATH }}
          cd /home/${{ secrets.EC2_USER }}/${{ secrets.EC2_FRONT_PATH }}

          # Stop PM2 process if running
          pm2 stop ${{ secrets.EC2_TARGET_INSTANCE }} || true

          # Remove old files including node_modules
          rm -rf .next node_modules public package.json package-lock.json next.config.ts ecosystem.config.js .env.* logs

    - name: Copy files to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_SSH_PORT || 22 }}
        source: "deploy.tar.gz"
        target: "/home/${{ secrets.EC2_USER }}/${{ secrets.EC2_FRONT_PATH }}"

    - name: Start application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_SSH_PORT || 22 }}
        command_timeout: 30m
        script: |
          set -e

          echo "=== [1/11] Navigating to deployment directory ==="
          cd /home/${{ secrets.EC2_USER }}/${{ secrets.EC2_FRONT_PATH }}
          echo "✓ Current directory: $(pwd)"

          echo "=== [2/11] Extracting deployment package ==="
          tar -xzf deploy.tar.gz
          rm deploy.tar.gz
          echo "✓ Package extracted and cleaned up"

          echo "=== [3/11] Setting up environment file ==="
          cp .env.dev .env.production.local
          # Inject environment variables
          echo "NEXT_PUBLIC_PORTONE_STORE_ID=${{ secrets.PORTONE_STORE_ID }}" >> .env.production.local
          echo "✓ Environment configured for production"

          echo "=== [4/11] Creating logs directory ==="
          mkdir -p logs
          echo "✓ Logs directory ready"

          echo "=== [5/11] Checking PM2 ==="
          if ! command -v pm2 &> /dev/null; then
            echo "Installing PM2 globally..."
            npm install -g pm2
          fi
          pm2 --version
          echo "✓ PM2 is ready"

          echo "=== [6/11] Installing dependencies (please wait...) ==="
          # Clean npm cache to avoid any corruption
          npm cache clean --force
          # Install production dependencies only
          npm ci --production --loglevel=warn
          echo "✓ Dependencies installed"

          # Verify critical packages
          echo "Verifying Next.js installation..."
          npm list next
          echo "Node modules summary:"
          ls -lh node_modules/ | wc -l
          echo "packages installed"

          echo "=== [7/11] Verifying Next.js installation ==="
          if [ -f "node_modules/next/dist/bin/next" ]; then
            echo "✓ Next.js binary found"
            ls -lh node_modules/next/dist/bin/next
          else
            echo "✗ ERROR: Next.js binary not found!"
            echo ""
            echo "Debugging information:"
            echo "1. Checking if next package exists:"
            ls -la node_modules/ | grep next || echo "No next package found"
            echo ""
            echo "2. Checking next folder contents:"
            ls -la node_modules/next/ 2>/dev/null || echo "next folder doesn't exist"
            echo ""
            echo "3. Checking if dist folder exists:"
            ls -la node_modules/next/dist/ 2>/dev/null || echo "dist folder doesn't exist"
            echo ""
            echo "4. Checking package.json:"
            cat package.json | grep -A 2 -B 2 '"next"'
            echo ""
            exit 1
          fi

          echo "=== [8/11] Stopping existing process ==="
          pm2 delete ${{ secrets.EC2_TARGET_INSTANCE }} 2>/dev/null && echo "✓ Old process stopped" || echo "✓ No process to stop"

          echo "=== [9/11] Starting new process ==="
          pm2 start ecosystem.config.js --env development
          echo "✓ Process started"

          echo ""
          echo "=========================================="
          echo "✓✓✓ DEPLOYMENT COMPLETED SUCCESSFULLY ✓✓✓"
          echo "=========================================="
